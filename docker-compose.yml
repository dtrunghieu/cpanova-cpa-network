
services:

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: cpa-network/ver-1
    volumes:
      - .:/app
    ports:
      - 8000:80
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: "postgres:15"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"